name: build-and-push

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - ".github/workflows/build-push.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - ".github/workflows/build-push.yml"
  workflow_dispatch:

permissions:
  id-token: write # lets the job request an OIDC token for AWS
  contents: read

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-west-1
  REGISTRY: 590183753633.dkr.ecr.us-west-1.amazonaws.com
  REPOSITORY: k8s-aws-portfolio
  ROLE_ARN: arn:aws:iam::590183753633:role/github-actions-ecr-push

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Build image
        run: |
          docker build \
            --build-arg APP_VERSION=${{ github.sha }} \
            -t $REGISTRY/$REPOSITORY:${{ github.sha }} .

      # Scan BEFORE pushing: HIGH findings are reported, CRITICAL ones fail the build.
      # --ignore-unfixed skips vulnerabilities that have no patch available yet.
      - name: Scan image with Trivy
        run: |
          IMAGE=$REGISTRY/$REPOSITORY:${{ github.sha }}
          TRIVY="docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --ignore-unfixed --no-progress"
          $TRIVY --severity HIGH --exit-code 0 $IMAGE
          $TRIVY --severity CRITICAL --exit-code 1 $IMAGE

            # Everything below runs only on main, never on pull requests
      - name: Configure AWS credentials (OIDC, no stored keys)
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Tags are immutable, so a re-run of the same commit would fail at push.
      # Ask ECR first; only "image not found" means push. Any other error stops the job.
      - name: Check if tag already exists
        id: check
        if: github.event_name != 'pull_request'
        run: |
          if aws ecr describe-images --repository-name "$REPOSITORY" \
               --image-ids imageTag=${{ github.sha }} --region "$AWS_REGION" \
               > /dev/null 2> err.txt; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag ${{ github.sha }} already in ECR, skipping push"
          elif grep -q ImageNotFoundException err.txt; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat err.txt
            exit 1
          fi

      - name: Log in to ECR
        if: github.event_name != 'pull_request' && steps.check.outputs.exists != 'true'
        run: |
          aws ecr get-login-password --region $AWS_REGION \
            | docker login --username AWS --password-stdin $REGISTRY

      - name: Push image
        if: github.event_name != 'pull_request' && steps.check.outputs.exists != 'true'
        run: docker push $REGISTRY/$REPOSITORY:${{ github.sha }}