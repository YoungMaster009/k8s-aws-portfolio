apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../k8s
images:
  - name: k8s-aws-portfolio
    newName: 590183753633.dkr.ecr.us-west-1.amazonaws.com/k8s-aws-portfolio
    newTag: e3f481ee0add704851a69b6bcff623e8937517b9
patches:
  - target:
      kind: Service
      name: portfolio-app
    patch: |-
      - op: add
        path: /spec/type
        value: LoadBalancer
      - op: add
        path: /metadata/annotations
        value:
          service.beta.kubernetes.io/aws-load-balancer-ssl-cert: arn:aws:acm:us-west-1:590183753633:certificate/aff2f3cb-c873-4616-965e-f8e792a6ac8d
          service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
          service.beta.kubernetes.io/aws-load-balancer-backend-protocol: tcp
      - op: add
        path: /spec/ports/0/name
        value: http
      - op: add
        path: /spec/ports/-
        value:
          name: https
          port: 443
          targetPort: 8080
